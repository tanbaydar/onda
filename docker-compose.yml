services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DANCED_DB_NAME}
      MYSQL_USER: ${DANCED_DB_USER}
      MYSQL_PASSWORD: ${DANCED_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DANCED_DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DANCED_DB_HOST: db
      DANCED_DB_PORT: "3306"
      DANCED_MEDIA_ROOT: /app/media
    command: >-
      sh -c "python manage.py migrate --noinput &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 2 --access-logfile - --error-logfile -"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - django_static:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/cities/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      DANCED_DOMAIN: ${DANCED_DOMAIN}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - django_static:/srv/django-static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  django_static:
  media_data:
  caddy_data:
  caddy_config:
