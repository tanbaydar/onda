name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_DATABASE: onda
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-random-like-characters-2026
      ONDA_DB_HOST: 127.0.0.1
      ONDA_DB_PORT: 3306
      ONDA_DB_NAME: onda
      ONDA_DB_USER: root
      ONDA_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test
      - run: >-
          DJANGO_SETTINGS_MODULE=config.settings_production
          ONDA_DOMAIN=example.com
          ONDA_DB_USER=onda_ci
          ONDA_DB_PASSWORD=ci-database-password-2026
          DJANGO_EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
          DJANGO_DEFAULT_FROM_EMAIL=noreply@example.com
          DJANGO_EMAIL_HOST=smtp.example.com
          DJANGO_EMAIL_HOST_USER=ci-smtp-user
          DJANGO_EMAIL_HOST_PASSWORD=ci-smtp-password
          DJANGO_EMAIL_USE_TLS=true
          DJANGO_EMAIL_USE_SSL=false
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=true
          DJANGO_SECURE_HSTS_PRELOAD=true
          python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - run: >-
          bandit -q -r backend/catalog backend/config backend/ingestion backend/users
          -x backend/catalog/tests,backend/config/tests,backend/ingestion/tests,backend/users/tests,backend/catalog/migrations,backend/ingestion/migrations,backend/users/migrations
      - run: pip-audit -r backend/requirements.txt

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan source, dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          timeout: 10m0s
      - name: Build production images
        run: |
          docker build --file infrastructure/docker/mysql.Dockerfile --tag onda-db:ci .
          docker build --file infrastructure/docker/backend.Dockerfile --tag onda-web:ci .
          docker build --file infrastructure/docker/frontend.Dockerfile --tag onda-caddy:ci .
      - name: Scan database image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: onda-db:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          timeout: 10m0s
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: onda-web:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          timeout: 10m0s
      - name: Scan proxy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: onda-caddy:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          timeout: 10m0s
