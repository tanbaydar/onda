name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: onda
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-random-like-characters-2026
      ONDA_DB_HOST: 127.0.0.1
      ONDA_DB_PORT: 3306
      ONDA_DB_NAME: onda
      ONDA_DB_USER: root
      ONDA_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test
      - run: >-
          DJANGO_SETTINGS_MODULE=config.settings_production
          ONDA_DOMAIN=example.com
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=true
          DJANGO_SECURE_HSTS_PRELOAD=true
          python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
