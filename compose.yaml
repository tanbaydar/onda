services:
  db:
    build:
      context: .
      dockerfile: infrastructure/docker/mysql.Dockerfile
    image: onda-db:local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${ONDA_DB_NAME:?ONDA_DB_NAME must be set}
      MYSQL_USER: ${ONDA_DB_USER:?ONDA_DB_USER must be set}
      MYSQL_PASSWORD: ${ONDA_DB_PASSWORD:?ONDA_DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${ONDA_DB_ROOT_PASSWORD:?ONDA_DB_ROOT_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:uid=999,gid=999,mode=1770
      - /var/run/mysqld:uid=999,gid=999,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - database

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      ONDA_DOMAIN: ${ONDA_DOMAIN:?ONDA_DOMAIN must be set}
      ONDA_DB_HOST: db
      ONDA_DB_PORT: "3306"
      ONDA_DB_NAME: ${ONDA_DB_NAME:?ONDA_DB_NAME must be set}
      ONDA_DB_USER: ${ONDA_DB_USER:?ONDA_DB_USER must be set}
      ONDA_DB_PASSWORD: ${ONDA_DB_PASSWORD:?ONDA_DB_PASSWORD must be set}
      ONDA_MEDIA_ROOT: /app/media
      EMAIL_VERIFICATION_ENFORCED: ${EMAIL_VERIFICATION_ENFORCED:-true}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-noreply@onda.local}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-localhost}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-true}
      DJANGO_EMAIL_USE_SSL: ${DJANGO_EMAIL_USE_SSL:-false}
      DJANGO_EMAIL_TIMEOUT: ${DJANGO_EMAIL_TIMEOUT:-10}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
    command: >-
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 2 --timeout 30 --forwarded-allow-ips=*
      --access-logfile - --error-logfile -
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - django_static:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/api/cities/',
          headers={'Host': os.environ['ONDA_DOMAIN'], 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=5)
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
      - database

  caddy:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      ONDA_DOMAIN: ${ONDA_DOMAIN:?ONDA_DOMAIN must be set}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL must be set}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - django_static:/srv/django-static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - edge

volumes:
  mysql_data:
  django_static:
  media_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  database:
    internal: true
