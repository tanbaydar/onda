results:
  page_1:
    p95_ms_each_run: [87.641, 87.499, 97.310]
    p95_ms_median: 87.641
    response_items: 20
  page_50:
    p95_ms_each_run: [81.976, 71.294, 77.636]
    p95_ms_median: 77.636
    response_items: 20
  not_included:
    - "A first run that started immediately after the seed gave 255.982 ms and 233.060 ms. The cause was not examined. The three runs above started later."

plan:
  command: "EXPLAIN ANALYZE of the UNION ALL statement for the benchmark viewer"
  followees_read: 50
  rows_materialized_for_page_1: 7920
  access: "Each branch starts at the primary key of FOLLOW and does one index lookup for each followee on its source table."
  sort: "Top-21 sort on (activity_at, activity_type, source_key), all descending"
  table_scans_of_source_tables: 0
  isolation_level: "READ-COMMITTED"

